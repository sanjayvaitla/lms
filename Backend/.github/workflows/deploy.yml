name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/LMS/LMS-Backend

            git fetch origin
            git reset --hard origin/main

            npm install

            npx ts-node fix_db.ts

            npm run build

            pm2 restart lms-backend

            echo "Backend deployed successfully."
